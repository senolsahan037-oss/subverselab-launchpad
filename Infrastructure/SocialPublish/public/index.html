<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Social Publish — Review Queue</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>Social Publish</h1>
    <div id="auth-area">
      <button id="sign-in-btn">Sign in with Google</button>
      <span id="user-email" hidden></span>
    </div>
  </header>

  <main id="app" hidden>
    <div class="filters">
      <button data-status="draft" class="filter-btn active">Draft</button>
      <button data-status="scheduled" class="filter-btn">Scheduled</button>
      <button data-status="published" class="filter-btn">Published</button>
      <button data-status="partially_published" class="filter-btn">Partial</button>
      <button data-status="failed" class="filter-btn">Failed</button>
      <button data-status="canceled" class="filter-btn">Canceled</button>
    </div>
    <div id="drafts-list"></div>
  </main>

  <p id="signed-out-msg">Sign in to review pending content.</p>

  <script type="module" src="app.js"></script>
</body>
</html>
